<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cryostock</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#F3F6F9; --surface:#FFFFFF; --surface-2:#E7ECF1; --surface-3:#DCE3EA;
    --border:#D2DAE2; --text:#101923; --text-muted:#57677A; --text-faint:#8B99A8;
    --accent:#2563A6; --accent-strong:#163F6B; --accent-soft:#DCEAF7; --cyan:#0891B2;
    --danger:#B3261E; --danger-soft:#FBE7E5; --success:#1E8A5F;
    --shadow:0 8px 24px rgba(16,25,35,0.12);
    --type-tumor:#C2760C; --type-cart:#7C3AED; --type-nk:#0F9D74; --type-primary:#C2417B; --type-other:#64748B;
    --font-display:'Archivo','Arial Narrow',sans-serif;
    --font-body:'IBM Plex Sans',system-ui,-apple-system,sans-serif;
    --font-mono:'IBM Plex Mono','SFMono-Regular',Consolas,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0A121C; --surface:#101B29; --surface-2:#16273A; --surface-3:#1D3049;
      --border:#24384F; --text:#E7EEF5; --text-muted:#8FA3B8; --text-faint:#607488;
      --accent:#5B9FDD; --accent-strong:#8FC1EE; --accent-soft:#17324A; --cyan:#22D3EE;
      --danger:#E5766B; --danger-soft:#3A1E1D; --success:#3FCB93;
      --shadow:0 8px 28px rgba(0,0,0,0.45);
      --type-tumor:#E0983A; --type-cart:#A78BFA; --type-nk:#34D399; --type-primary:#E8709F; --type-other:#94A3B8;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0A121C; --surface:#101B29; --surface-2:#16273A; --surface-3:#1D3049;
    --border:#24384F; --text:#E7EEF5; --text-muted:#8FA3B8; --text-faint:#607488;
    --accent:#5B9FDD; --accent-strong:#8FC1EE; --accent-soft:#17324A; --cyan:#22D3EE;
    --danger:#E5766B; --danger-soft:#3A1E1D; --success:#3FCB93;
    --shadow:0 8px 28px rgba(0,0,0,0.45);
    --type-tumor:#E0983A; --type-cart:#A78BFA; --type-nk:#34D399; --type-primary:#E8709F; --type-other:#94A3B8;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text); font-family:var(--font-body);
    font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--accent-soft);}
  button, input, select, textarea{font-family:inherit; font-size:inherit; color:inherit;}
  button{cursor:pointer;}
  a{color:var(--accent);}
  :focus-visible{outline:2px solid var(--cyan); outline-offset:2px;}
  h1,h2,h3{font-family:var(--font-display); font-weight:700; text-wrap:balance; margin:0;}
  .mono{font-family:var(--font-mono);}
  .tabular{font-variant-numeric:tabular-nums;}

  .app-shell{display:flex; flex-direction:column; height:100vh; min-height:560px;}

  /* ---------- config notice ---------- */
  .config-notice{
    max-width:520px; margin:80px auto; padding:28px; background:var(--surface); border:1px solid var(--border);
    border-radius:12px; box-shadow:var(--shadow);
  }
  .config-notice h1{font-size:19px; margin-bottom:10px;}
  .config-notice p{color:var(--text-muted); margin:0 0 10px;}
  .config-notice code{
    display:block; background:var(--surface-2); border:1px solid var(--border); border-radius:6px;
    padding:10px 12px; font-family:var(--font-mono); font-size:12.5px; margin:10px 0; overflow-x:auto;
  }

  /* ---------- auth screen ---------- */
  .auth-screen{
    min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .auth-card{
    width:360px; max-width:100%; background:var(--surface); border:1px solid var(--border); border-radius:12px;
    padding:28px; box-shadow:var(--shadow); display:flex; flex-direction:column; gap:14px;
  }
  .auth-card .brand-mark{font-family:var(--font-display); font-weight:700; font-size:21px; display:flex; align-items:center; gap:8px;}
  .auth-card .sub{color:var(--text-muted); font-size:12.5px; margin-top:-6px;}
  .auth-error{
    background:var(--danger-soft); color:var(--danger); font-size:12.5px; padding:8px 10px; border-radius:6px; display:none;
  }
  .auth-error.show{display:block;}
  .auth-note{font-size:12px; color:var(--text-faint); text-align:center; margin-top:4px;}
  .auth-note a{cursor:pointer;}

  /* ---------- topbar ---------- */
  .topbar{
    display:flex; align-items:center; gap:12px 16px; padding:10px 18px; flex:0 0 auto; flex-wrap:wrap;
    background:var(--surface); border-bottom:1px solid var(--border);
  }
  .filter-bar{
    display:flex; align-items:center; gap:10px; padding:9px 12px; flex-wrap:wrap;
    background:var(--surface-2); border:1px solid var(--border); border-radius:8px; margin:18px 0;
  }
  .filter-label{font-size:11px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.04em;}
  .filter-bar select{
    padding:5px 9px; border-radius:6px; border:1px solid var(--border); background:var(--surface);
    font-size:12.5px; max-width:180px;
  }
  .filter-bar a{font-size:12px; cursor:pointer; color:var(--text-faint); margin-left:auto;}
  .filter-bar a:hover{color:var(--accent);}
  .pick-banner{
    display:flex; align-items:center; justify-content:space-between; gap:8px 12px; padding:9px 18px; flex-wrap:wrap;
    background:var(--accent-soft); border-bottom:1px solid var(--accent); font-size:13px; color:var(--accent-strong);
  }
  .pick-banner[hidden]{display:none;}
  .pick-banner .btn{flex:0 0 auto;}
  .cell.pickable{border-style:solid; border-color:var(--cyan); background:var(--accent-soft); color:var(--accent-strong); cursor:pointer;}
  .cell.pickable:hover{background:var(--cyan); color:#fff;}
  .cell.selected{outline:2px solid var(--cyan); outline-offset:1px;}

  .selection-box{border:1px solid var(--accent); border-radius:8px; margin-bottom:12px; overflow:hidden; background:var(--accent-soft);}
  .selection-head{display:flex; justify-content:space-between; align-items:center; padding:7px 10px; font-size:11.5px; font-weight:600; color:var(--accent-strong); text-transform:uppercase; letter-spacing:0.03em;}
  .selection-head a{cursor:pointer; font-weight:500; text-transform:none; letter-spacing:0; font-size:11.5px;}
  .selection-row{display:flex; justify-content:space-between; gap:8px; padding:5px 10px; font-size:12px; cursor:pointer; border-top:1px solid var(--border);}
  .selection-row:hover{background:var(--surface-3);}
  .selection-row .pos{font-weight:600;}
  .selection-row .who{color:var(--text-muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}

  .context-menu{
    position:fixed; z-index:60; background:var(--surface); border:1px solid var(--border); border-radius:8px;
    box-shadow:var(--shadow); padding:4px; display:flex; flex-direction:column; min-width:150px;
  }
  .context-menu[hidden]{display:none;}
  .context-menu button{
    display:block; width:100%; text-align:left; padding:7px 10px; border-radius:5px; background:transparent; border:none;
    font-size:13px; color:var(--text);
  }
  .context-menu button:hover{background:var(--surface-2);}
  .context-menu button.danger{color:var(--danger);}
  .context-menu button.danger:hover{background:var(--danger-soft);}
  .brand{display:flex; align-items:baseline; gap:8px; flex:0 0 auto; cursor:pointer;}
  .brand:hover .mark{color:var(--accent);}
  .brand .mark{font-family:var(--font-display); font-weight:700; font-size:19px; letter-spacing:-0.01em;}
  .brand .tagline{font-size:11.5px; color:var(--text-faint); display:none;}
  @media (min-width:900px){ .brand .tagline{display:inline;} }
  .search-wrap{flex:1 1 auto; max-width:460px; position:relative;}
  .search-wrap input{
    width:100%; padding:8px 12px 8px 32px; border-radius:7px; border:1px solid var(--border);
    background:var(--surface-2); color:var(--text);
  }
  .search-wrap input:focus{background:var(--surface); border-color:var(--accent);}
  .search-wrap svg{position:absolute; left:9px; top:50%; transform:translateY(-50%); opacity:0.5; pointer-events:none;}
  .nav-tabs{display:flex; gap:2px; flex:0 0 auto;}
  .nav-tab{padding:7px 12px; border-radius:6px; font-weight:500; color:var(--text-muted); background:transparent; border:1px solid transparent;}
  .nav-tab:hover{background:var(--surface-2);}
  .nav-tab.active{background:var(--accent-soft); color:var(--accent-strong);}
  .topbar-right{display:flex; align-items:center; gap:10px; margin-left:auto; flex:0 0 auto;}
  .account-chip{display:flex; align-items:center; gap:8px; font-size:12.5px; color:var(--text-muted);}
  .account-chip .who{font-weight:600; color:var(--text);}
  .btn{
    padding:7px 13px; border-radius:6px; border:1px solid var(--border); background:var(--surface-2);
    font-weight:500; white-space:nowrap;
  }
  .btn:hover{background:var(--surface-3);}
  .btn:disabled{opacity:0.45; cursor:not-allowed;}
  .btn-primary{background:var(--accent); border-color:var(--accent); color:#fff;}
  .btn-primary:hover{background:var(--accent-strong); border-color:var(--accent-strong);}
  .btn-danger{background:transparent; border-color:var(--danger); color:var(--danger);}
  .btn-danger:hover{background:var(--danger-soft);}
  .btn-block{width:100%;}
  #save-status{font-size:12px; color:var(--text-faint); min-width:70px; text-align:right;}
  #save-status.saving{color:var(--cyan);}
  #save-status.err{color:var(--danger);}

  /* ---------- body ---------- */
  .body-shell{display:flex; flex:1 1 auto; min-height:0;}
  .sidebar{
    width:270px; flex:0 0 auto; border-right:1px solid var(--border); background:var(--surface);
    overflow-y:auto; padding:12px 10px 90px;
  }
  @media (max-width:760px){ .sidebar{width:210px;} }
  .tree-node{margin-bottom:2px;}
  .tree-row{
    display:flex; align-items:center; gap:6px; padding:6px 7px; border-radius:6px; cursor:pointer;
  }
  .tree-row:hover{background:var(--surface-2);}
  .tree-row.active{background:var(--accent-soft);}
  .tree-row .chev{width:14px; flex:0 0 auto; opacity:0.55; transition:transform .12s;}
  .tree-row.open .chev{transform:rotate(90deg);}
  .tree-row .name{flex:1 1 auto; font-weight:500; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .tree-row.tank .name{font-family:var(--font-display); font-weight:600;}
  .tree-row .count{font-size:11px; color:var(--text-faint); font-family:var(--font-mono); flex:0 0 auto;}
  .tree-children{margin-left:16px; border-left:1px dashed var(--border); padding-left:6px;}
  .tree-add{
    display:flex; align-items:center; gap:6px; padding:5px 7px; margin-left:16px; border-radius:6px;
    color:var(--text-faint); font-size:12.5px; cursor:pointer;
  }
  .tree-add:hover{background:var(--surface-2); color:var(--accent);}
  .sidebar-foot{margin-top:10px;}
  .row-actions{display:none; gap:2px; flex:0 0 auto;}
  .tree-row:hover .row-actions{display:flex;}
  @media (hover:none){ .row-actions{display:flex;} } /* touch devices have no hover — always show */
  .icon-btn{
    width:20px; height:20px; display:flex; align-items:center; justify-content:center; border-radius:4px;
    color:var(--text-faint); background:transparent; border:none;
  }
  .icon-btn:hover{background:var(--surface-3); color:var(--text);}
  .icon-btn:disabled{opacity:0.25; cursor:default;}
  .icon-btn:disabled:hover{background:transparent;}
  .icon-btn.danger:hover{color:var(--danger);}

  .main{flex:1 1 auto; overflow-y:auto; padding:26px 30px 60px;}
  .empty-state{
    display:flex; flex-direction:column; align-items:flex-start; gap:12px; max-width:440px; margin-top:40px;
  }
  .empty-state h2{font-size:21px;}
  .empty-state p{color:var(--text-muted); margin:0;}

  /* dashboard */
  .dash-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:20px; gap:12px; flex-wrap:wrap;}
  .dash-head h1{font-size:23px;}
  .stat-strip{display:flex; gap:10px; flex-wrap:wrap;}
  .stat-pill{
    background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:8px 14px;
    display:flex; flex-direction:column; gap:2px; min-width:92px;
  }
  .stat-pill .n{font-family:var(--font-mono); font-size:19px; font-weight:500;}
  .stat-pill .l{font-size:11px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.04em;}
  .tank-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px; margin-top:18px;}
  .tank-card{
    background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:16px; cursor:pointer;
    transition:border-color .12s, box-shadow .12s;
  }
  .tank-card:hover{border-color:var(--accent); box-shadow:var(--shadow);}
  .tank-card h3{font-size:16px; margin-bottom:8px;}
  .tank-card .meta{font-size:12.5px; color:var(--text-muted); display:flex; flex-direction:column; gap:3px;}
  .occ-bar{height:5px; border-radius:3px; background:var(--surface-3); overflow:hidden; margin-top:10px;}
  .occ-bar > div{height:100%; background:var(--accent);}
  .section-title{
    font-family:var(--font-display); font-size:13px; text-transform:uppercase; letter-spacing:0.05em;
    color:var(--text-faint); margin:30px 0 12px;
  }
  .recent-list{display:flex; flex-direction:column; border:1px solid var(--border); border-radius:10px; overflow:hidden; background:var(--surface);}
  .recent-row{
    display:flex; align-items:center; gap:6px 12px; padding:10px 14px; border-bottom:1px solid var(--border); cursor:pointer;
    flex-wrap:wrap;
  }
  .recent-row:last-child{border-bottom:none;}
  .recent-row:hover{background:var(--surface-2);}
  .type-dot{width:9px; height:9px; border-radius:50%; flex:0 0 auto;}
  .recent-row .cell-line{font-weight:500; flex:1 1 auto; min-width:120px;}
  .recent-row .pos{font-family:var(--font-mono); font-weight:600; min-width:32px; flex:0 0 auto;}
  .recent-row .breadcrumb{font-size:12px; color:var(--text-faint); font-family:var(--font-mono); flex:1 1 auto; min-width:160px;}
  .recent-row .when{font-size:11.5px; color:var(--text-faint); flex:0 0 auto; margin-left:auto; white-space:nowrap;}

  /* activity log */
  .log-row{display:flex; flex-direction:column; gap:2px; padding:11px 14px; border-bottom:1px solid var(--border);}
  .log-row:last-child{border-bottom:none;}
  .log-row .line{font-size:13px;}
  .log-row .who{font-weight:600;}
  .log-row .when{font-size:11.5px; color:var(--text-faint); font-family:var(--font-mono);}
  .log-action{display:inline-block; font-size:10.5px; text-transform:uppercase; letter-spacing:0.04em; padding:1px 6px; border-radius:4px; margin-right:6px;}
  .log-action.insert{background:var(--success); color:#fff;}
  .log-action.update{background:var(--accent); color:#fff;}
  .log-action.delete{background:var(--danger); color:#fff;}

  /* box view */
  .box-head{display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:6px; flex-wrap:wrap;}
  .box-layout{display:flex; gap:28px; align-items:flex-start; margin-top:16px; flex-wrap:wrap;}
  .box-grid-col{flex:0 0 auto;}
  .box-list-col{flex:1 1 260px; min-width:240px; max-width:400px;}
  .box-list-col .recent-list{max-height:640px; overflow-y:auto;}
  .breadcrumb-trail{font-size:12.5px; color:var(--text-faint); margin-bottom:4px;}
  .breadcrumb-trail span:last-child{color:var(--text);}
  .box-head h1{font-size:22px;}
  .box-sub{font-size:12.5px; color:var(--text-muted); font-family:var(--font-mono); margin-top:3px;}
  .legend{display:flex; gap:12px; flex-wrap:wrap; margin:16px 0 20px;}
  .legend-item{display:flex; align-items:center; gap:5px; font-size:12px; color:var(--text-muted);}
  .legend-swatch{width:11px; height:11px; border-radius:3px;}
  .grid-scroll{overflow:auto; padding-bottom:10px;}
  .cryo-grid{display:inline-grid; gap:3px;}
  .grid-label{
    display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-size:11px;
    color:var(--text-faint);
  }
  .cell{
    width:var(--cell-size,34px); height:var(--cell-size,34px); border-radius:5px; border:1px solid var(--border); background:var(--surface-2);
    display:flex; align-items:center; justify-content:center; font-family:var(--font-mono); font-size:9.5px;
    color:var(--text-faint); position:relative;
  }
  .cell.empty{border-style:dashed;}
  .cell.empty:hover{background:var(--surface-3); color:var(--accent); border-color:var(--accent);}
  .cell.filled{border-style:solid; color:#fff; font-weight:500;}
  .cell.filled:hover{filter:brightness(1.08); box-shadow:var(--shadow);}
  .cell.highlight{outline:2px solid var(--cyan); outline-offset:2px;}
  .myco-badge{position:absolute; bottom:-2px; right:-2px; width:9px; height:9px; border-radius:50%; border:1.5px solid var(--surface);}
  .myco-badge.negative{background:var(--success);}
  .legend-swatch.myco-negative{border-radius:50%; background:var(--success);}

  /* slide-over panel */
  .panel-overlay{
    position:fixed; inset:0; background:rgba(10,16,24,0.32); display:flex; justify-content:flex-end; z-index:40;
  }
  .panel{
    width:380px; max-width:92vw; background:var(--surface); height:100%; box-shadow:var(--shadow);
    overflow-y:auto; padding:22px 22px 30px; display:flex; flex-direction:column; gap:14px;
  }
  .panel-head{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .panel-head h2{font-size:18px;}
  .panel-head .pos-tag{
    font-family:var(--font-mono); font-size:12px; color:var(--accent); background:var(--accent-soft);
    padding:2px 8px; border-radius:5px; display:inline-block; margin-top:4px;
  }
  .field{display:flex; flex-direction:column; gap:5px;}
  .field label{font-size:11.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.04em;}
  .field input, .field select, .field textarea{
    padding:8px 10px; border-radius:6px; border:1px solid var(--border); background:var(--surface-2); width:100%;
  }
  .field input:focus, .field select:focus, .field textarea:focus{background:var(--surface); border-color:var(--accent);}
  .field textarea{resize:vertical; min-height:56px;}
  .field-row{display:flex; gap:10px;}
  .field-row .field{flex:1 1 0;}
  .panel-meta{font-size:11.5px; color:var(--text-faint); border-top:1px solid var(--border); padding-top:10px;}
  .panel-actions{display:flex; gap:8px; margin-top:6px; flex-wrap:wrap;}
  .panel-actions .btn{min-width:80px;}
  .panel-actions .btn{flex:1 1 auto;}

  /* modal */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(10,16,24,0.4); display:flex; align-items:center; justify-content:center; z-index:50;
  }
  .modal{
    width:340px; max-width:90vw; background:var(--surface); border-radius:12px; box-shadow:var(--shadow);
    padding:22px; display:flex; flex-direction:column; gap:14px;
  }
  .modal h2{font-size:17px;}
  .modal-actions{display:flex; gap:8px; justify-content:flex-end; margin-top:4px;}

  /* search results */
  .search-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:14px;}
  .search-head h1{font-size:20px;}
  .no-results{color:var(--text-faint); margin-top:24px;}

  @media (max-width:760px){
    .body-shell{flex-direction:column;}
    .sidebar{width:100%; max-height:180px; border-right:none; border-bottom:1px solid var(--border);}
    .main{padding:18px 16px 50px;}
  }

  @media (max-width:480px){
    .sidebar{max-height:120px;}
    .topbar{padding:8px 12px; gap:8px 10px;}
    .brand .mark{font-size:16px;}
    .search-wrap{order:3; max-width:none; flex:1 1 100%;}
    .topbar-right{gap:6px;}
    .topbar-right .btn{padding:6px 9px; font-size:12.5px;}
    .account-chip{display:none;} /* saves space on a narrow screen — who you are is not critical here */
    .filter-bar{padding:8px 10px;}
    .filter-bar select{max-width:120px; font-size:12px;}
    .panel{width:100vw; max-width:100vw;}
    .modal{width:92vw;}
    :root{--cell-size:28px; --label-size:20px;}
    .cell{font-size:8.5px;}
    .grid-label{font-size:9.5px;}
    .cryo-grid{gap:2px;}
  }
</style>
</head>
<body>

<div id="config-root"></div>
<div id="auth-root"></div>

<div class="app-shell" id="app-shell" hidden>
  <header class="topbar">
    <div class="brand" onclick="goHome()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();goHome();}" role="button" tabindex="0" title="Back to overview">
      <span class="mark">🧊 Cryostock</span>

  function fmtDate(iso){
    if(!iso) return "—";
    var d = new Date(iso);
    if(isNaN(d)) return iso;
    return d.toLocaleDateString("en-US", {day:"2-digit", month:"short", year:"numeric"});
  }
  function fmtDateTime(iso){
    if(!iso) return "—";

    if(isNaN(d)) return "—";

  function timeAgo(iso){

    var s = Math.floor((Date.now() - new Date(iso).getTime())/1000);
    if(s < 60) return "just now";
    if(s < 3600) return Math.floor(s/60) + "m ago";
    if(s < 86400) return Math.floor(s/3600) + "h ago";
    return Math.floor(s/86400) + "d ago";

  function parseAuthHash(){
    var hash = window.location.hash;
    if(!hash || hash.length < 2) return {};
    var params = new URLSearchParams(hash.slice(1));
    var obj = {};
    params.forEach(function(v,k){ obj[k]=v; });
    return obj;
  }
  function clearAuthHash(){
    history.replaceState(null, "", window.location.pathname + window.location.search);
  }

  var needsPasswordSetup = false;

  async function initAuth(){
    var hashParams = parseAuthHash();

    if(hashParams.error){
      var msg = hashParams.error_code === "otp_expired"
        ? "This invite/reset link has expired or was already used. Ask your lab admin to send you a new one."
        : (hashParams.error_description ? decodeURIComponent(hashParams.error_description.replace(/\+/g," ")) : "This link is invalid.");
      clearAuthHash();
      renderAuthScreen(msg);
      return;
    }

    if(hashParams.type === "invite" || hashParams.type === "recovery"){
      needsPasswordSetup = true;
    }

    var got = await supabase.auth.getSession();
    session = got.data.session;
    if(session){ handleAuthed(); } else { renderAuthScreen(); }

    supabase.auth.onAuthStateChange(function(event, sess){
      session = sess;
      if(session){ handleAuthed(); }
      else{
        document.getElementById("app-shell").hidden = true;
        if(realtimeChannel){ supabase.removeChannel(realtimeChannel); realtimeChannel = null; }

  // Swaps sort_order between an item and its neighbor (dir: -1 up, +1 down)
  // within the given sibling list (already in on-screen order).
  async function moveSibling(entityType, siblings, id, dir){
    var idx = siblings.findIndex(function(x){ return x.id===id; });
    var swapIdx = idx + dir;
    if(idx===-1 || swapIdx<0 || swapIdx>=siblings.length) return;
    var a = siblings[idx], b = siblings[swapIdx];
    var table = entityType==="tank" ? "tanks" : entityType==="rack" ? "racks" : "boxes";
    await withSaving(function(){
      return Promise.all([
        supabase.from(table).update({sort_order:b.sortOrder}).eq("id", a.id),
        supabase.from(table).update({sort_order:a.sortOrder}).eq("id", b.id)
      ]).then(function(results){
        var failed = results.find(function(r){ return r.error; });
        return failed ? {error: failed.error} : {error:null};
      });
    });
    await refreshInventory();
  }

  function moveTank(id, dir){ moveSibling("tank", state.tanks, id, dir); }
  function moveRack(tankId, id, dir){
    var tank = state.tanks.find(function(t){return t.id===tankId;});
    if(tank) moveSibling("rack", tank.racks, id, dir);
  }
  function moveBox(rackId, id, dir){
    var rack = null;
    state.tanks.forEach(function(t){ var r = t.racks.find(function(x){return x.id===rackId;}); if(r) rack = r; });
    if(rack) moveSibling("box", rack.boxes, id, dir);
  }

    ui.view = st.view || "inventory";

    html += '</div>';

    html += '<div class="tank-grid">';
    state.tanks.forEach(function(tank){
      var occ=0, tot=0;

  function normalizeSearch(s){
    return String(s||"").toLowerCase().replace(/[^a-z0-9]/g, "");
  }
  function jsEsc(s){
    return String(s||"").replace(/\\/g,"\\\\").replace(/'/g,"\\'");
  }

  // Groups samples by cell line name, treating spelling variants (dashes, spaces,
  // underscores, case) as the same line — e.g. "PC3-PIP" and "PC3 PIP" count together.
  function computeBoxesWithSpace(){
    var list = [];
    state.tanks.forEach(function(tank){
      tank.racks.forEach(function(rack){
        rack.boxes.forEach(function(box){
          var occ = boxOccupied(box), tot = boxTotal(box), empty = tot - occ;
          if(empty > 0) list.push({tank:tank, rack:rack, box:box, empty:empty, occ:occ, tot:tot});
        });
      });
    });
    list.sort(function(a,b){ return b.empty - a.empty; });
    return list;
  }

  function jumpToBoxDirect(boxId){
    var loc = locateBox(boxId);
    if(!loc) return;
    ui.expandedTanks[loc.tank.id] = true;
    ui.expandedRacks[loc.rack.id] = true;
    selectBox(boxId);
  }

  function computeCellLineCounts(){
    var map = {};
    allVialsFlat().forEach(function(r){
      var name = (r.vial.cellLine || "").trim() || "(unnamed)";
      var norm = normalizeSearch(name) || "(unnamed)";
      if(!map[norm]) map[norm] = {count:0, variants:{}};
      map[norm].count++;
      map[norm].variants[name] = (map[norm].variants[name]||0) + 1;
    });
    var list = Object.keys(map).map(function(k){
      var entry = map[k];
      var bestLabel = Object.keys(entry.variants).sort(function(a,b){
        return entry.variants[b] - entry.variants[a];
      })[0];
      return {label:bestLabel, count:entry.count};
    });
    list.sort(function(a,b){ return b.count - a.count || a.label.localeCompare(b.label); });
    return list;
  }

  function searchFor(text){
    ui.searchQuery = text;
    document.getElementById("search-input").value = text;
    ui.view = "inventory";
    renderMain();
  }

  function distinctValues(getter){
    var set = {};
    allVialsFlat().forEach(function(r){
      var v = (getter(r.vial) || "").trim();
      if(v) set[v] = true;
    });
    return Object.keys(set).sort(function(a,b){ return a.localeCompare(b, undefined, {numeric:true}); });
  }

    return !!(ui.filterOwner || ui.filterClone || ui.filterPassage || ui.filterCellLine || ui.filterMyco || ui.filterType);

    ui.filterCellLine = ""; ui.filterMyco = ""; ui.filterType = "";

  function renderFilterControls(){
    function opts(values, current, allLabel){
      var html = '<option value=""'+(!current?" selected":"")+'>'+allLabel+'</option>';
      values.forEach(function(v){
        html += '<option value="'+esc(v)+'"'+(v===current?" selected":"")+'>'+esc(v)+'</option>';
      });
      return html;
    }
    var cellLineOpts = '<option value=""'+(!ui.filterCellLine?" selected":"")+'>Cell line: all</option>';
    computeCellLineCounts().forEach(function(cl){
      cellLineOpts += '<option value="'+esc(cl.label)+'"'+(cl.label===ui.filterCellLine?" selected":"")+'>'+esc(cl.label)+'</option>';
    });
    var typeOpts = '<option value=""'+(!ui.filterType?" selected":"")+'>Type: all</option>';
    TYPE_ORDER.forEach(function(k){
      typeOpts += '<option value="'+k+'"'+(k===ui.filterType?" selected":"")+'>'+TYPES[k].label+'</option>';
    });
    var mycoOpts = '<option value=""'+(!ui.filterMyco?" selected":"")+'>Mycoplasma: all</option>' +
      '<option value="negative"'+(ui.filterMyco==="negative"?" selected":"")+'>Negative</option>' +
      '<option value="unset"'+(ui.filterMyco==="unset"?" selected":"")+'>Not sure (not tested)</option>';

    var html = '<div class="filter-bar">';
    html += '<span class="filter-label">Filter</span>';
    html += '<select onchange="onFilterChange(\'filterCellLine\', this.value)">'+cellLineOpts+'</select>';
    html += '<select onchange="onFilterChange(\'filterType\', this.value)">'+typeOpts+'</select>';
    html += '<select onchange="onFilterChange(\'filterOwner\', this.value)">'+opts(distinctValues(function(v){return v.owner;}), ui.filterOwner, "Researcher: all")+'</select>';
    html += '<select onchange="onFilterChange(\'filterClone\', this.value)">'+opts(distinctValues(function(v){return v.clone;}), ui.filterClone, "Clone: all")+'</select>';
    html += '<select onchange="onFilterChange(\'filterPassage\', this.value)">'+opts(distinctValues(function(v){return v.passage;}), ui.filterPassage, "Passage: all")+'</select>';
    html += '<select onchange="onFilterChange(\'filterMyco\', this.value)">'+mycoOpts+'</select>';
    if(hasActiveFilters()) html += '<a onclick="clearFilters()">Clear filters</a>';
    html += '</div>';
    return html;
  }

  function renderSearchResults(){
    var q = normalizeSearch(ui.searchQuery);
    var results = allVialsFlat().filter(function(r){
      var v = r.vial;
      if(q){
        var hay = normalizeSearch([v.cellLine, v.owner, v.notes, v.medium, v.myco, v.clone, (TYPES[v.type]||{}).label, r.tank.name, r.rack.name, r.box.name].join(" "));
        if(hay.indexOf(q) === -1) return false;
      }
      if(ui.filterOwner && (v.owner||"") !== ui.filterOwner) return false;
      if(ui.filterClone && (v.clone||"") !== ui.filterClone) return false;
      if(ui.filterPassage && (v.passage||"") !== ui.filterPassage) return false;
      if(ui.filterCellLine && normalizeSearch(v.cellLine) !== normalizeSearch(ui.filterCellLine)) return false;
      if(ui.filterType && v.type !== ui.filterType) return false;
      if(ui.filterMyco === "negative" && v.myco !== "negative") return false;
      if(ui.filterMyco === "unset" && v.myco) return false;
      return true;
    });
    var title = ui.searchQuery.trim() ? 'Results for "'+esc(ui.searchQuery)+'"' : "Filtered results";
    var html = '<div class="search-head"><h1>'+title+'</h1><span class="section-title" style="margin:0">'+results.length+' sample(s)</span></div>';
    html += renderFilterControls();
    if(!results.length){
      html += '<div class="no-results">No samples match this search.</div>';
      return html;
    }
    html += '<div class="recent-list">';
    results.forEach(function(r){
      var t = TYPES[r.vial.type] || TYPES.other;
      html += '<div class="recent-row" onclick="jumpToVial(\''+r.box.id+'\',\''+r.pos+'\')">';
      html += '<span class="type-dot" style="background:var('+t.cssVar+')"></span>';
      html += '<span class="cell-line">'+esc(r.vial.cellLine||"(unnamed)")+'</span>';
      html += '<span class="breadcrumb">'+esc(r.tank.name)+' › '+esc(r.rack.name)+' › '+esc(r.box.name)+' › '+r.pos+'</span>';
      html += '<span class="when">P'+esc(r.vial.passage||"?")+' · '+esc(r.vial.owner||"—")+' · '+fmtDate(r.vial.freezeDate)+'</span>';
      html += '</div>';
    });
    html += '</div>';
    return html;
  }

  async function saveVial(boxId, pos){
    var cellLine = document.getElementById("f-cellLine").value.trim();
    if(!cellLine){ alert("Cell line / sample name is required."); return; }
    var row = {
      box_id: boxId,
      position: pos,

  // ---------- duplicate / move by clicking a target position ----------
  // Pick mode processes a QUEUE of {boxId, pos, vial|cellLine} items one at a
  // time (queue length 1 for a single sample, >1 for a multi-selection) — each
  // click on an empty cell resolves the current item and advances the queue.
  function startDuplicatePick(boxId, pos){
    var loc = locateBox(boxId);
    var vial = loc && loc.box.vials[pos];
    if(!vial) return;
    startPickQueue("duplicate", [{boxId:boxId, pos:pos, vial:vial}]);
  }

  function startMovePick(boxId, pos){
    var loc = locateBox(boxId);
    var vial = loc && loc.box.vials[pos];
    if(!vial) return;
    startPickQueue("move", [{boxId:boxId, pos:pos, cellLine:vial.cellLine}]);
  }

  function startPickQueue(kind, items){
    if(!items.length) return;
    ui.pickMode = {kind:kind, queue:items, index:0};
    ui.editingPos = null;
    ui.selectedCells = [];
    renderPickBanner();
    renderPanel();
    renderSidebar();
    renderMain();
  }

  function cancelPick(){
    ui.pickMode = null;
    renderPickBanner();
    renderMain();
  }

  // ---------- drag-and-drop move (single item, quick path) ----------
  var dragSource = null;
  function onCellDragStart(e, boxId, pos){
    dragSource = {boxId:boxId, pos:pos};
    if(e.dataTransfer){ e.dataTransfer.effectAllowed = "move"; e.dataTransfer.setData("text/plain", pos); }
  }
  async function onCellDrop(e, targetBoxId, targetPos){
    e.preventDefault();
    var src = dragSource;
    dragSource = null;
    if(!src) return;
    if(src.boxId === targetBoxId && src.pos === targetPos) return;
    await withSaving(function(){
      return supabase.from("samples")
        .update({box_id: targetBoxId, position: targetPos})
        .eq("box_id", src.boxId).eq("position", src.pos);
    });
    await refreshInventory();
  }

  async function resolvePick(targetBoxId, targetPos){
    if(!ui.pickMode) return;
    var m = ui.pickMode;
    var item = m.queue[m.index];
    if(targetBoxId === item.boxId && targetPos === item.pos) return; // no-op on itself

    if(m.kind === "duplicate"){
      var v = item.vial;
      await withSaving(function(){
        return supabase.from("samples").insert({
          box_id: targetBoxId, position: targetPos,
          cell_line: v.cellLine, type: v.type, passage: v.passage,
          freeze_date: v.freezeDate || null, count: v.count, medium: v.medium,
          myco: v.myco, clone: v.clone, viability: v.viability,
          owner: v.owner, notes: v.notes
        });
      });
    }else{
      await withSaving(function(){
        return supabase.from("samples")
          .update({box_id: targetBoxId, position: targetPos})
          .eq("box_id", item.boxId).eq("position", item.pos);
      });
    }
    await refreshInventory();
    if(ui.pickMode){
      ui.pickMode.index++;
      if(ui.pickMode.index >= ui.pickMode.queue.length) ui.pickMode = null;
    }
    renderPickBanner();
  }

  function renderPickBanner(){
    var el = document.getElementById("pick-banner");
    if(!el) return;
    if(!ui.pickMode){ el.hidden = true; return; }
    el.hidden = false;
    var m = ui.pickMode;
    var item = m.queue[m.index];
    var label = (item.vial && item.vial.cellLine) || item.cellLine || "sample";
    var progress = m.queue.length > 1 ? ' ('+(m.index+1)+' of '+m.queue.length+')' : '';
    if(m.kind === "duplicate"){
      el.innerHTML = '<span>Duplicating "'+esc(label)+'"'+progress+' — click an empty position (any box) to place it.</span>' +
        '<button class="btn btn-sm" onclick="cancelPick()">Done</button>';
    }else{
      el.innerHTML = '<span>Moving "'+esc(label)+'"'+progress+' from '+esc(item.pos)+' — click an empty position to move it there.</span>' +
        '<button class="btn btn-sm" onclick="cancelPick()">Cancel</button>';
    }
  }

  function openCellContextMenu(e, boxId, pos){
    e.preventDefault();
    var alreadySelected = ui.selectedCells.some(function(c){ return c.boxId===boxId && c.pos===pos; });
    if(!alreadySelected){
      ui.selectedCells = [{boxId:boxId, pos:pos}];
      renderSidebar(); renderMain();
    }
    var n = ui.selectedCells.length;
    var suffix = n > 1 ? " (" + n + ")" : "";
    var menu = document.getElementById("context-menu");
    menu.innerHTML =
      '<button onclick="ctxDuplicate()">Duplicate'+suffix+'</button>' +
      '<button onclick="ctxMove()">Move'+suffix+'</button>' +
      '<button class="danger" onclick="ctxRemove()">Remove'+suffix+'</button>';
    var x = e.clientX, y = e.clientY;
    menu.style.left = x + "px";
    menu.style.top = y + "px";
    menu.hidden = false;
    // keep it on-screen if opened near the right/bottom edge
    requestAnimationFrame(function(){
      var r = menu.getBoundingClientRect();
      if(r.right > window.innerWidth) menu.style.left = Math.max(4, window.innerWidth - r.width - 8) + "px";
      if(r.bottom > window.innerHeight) menu.style.top = Math.max(4, window.innerHeight - r.height - 8) + "px";
    });
  }
  function closeContextMenu(){
    var menu = document.getElementById("context-menu");
    if(menu) menu.hidden = true;
  }
  document.addEventListener("click", function(e){
    var menu = document.getElementById("context-menu");
    if(menu && !menu.hidden && !menu.contains(e.target)) closeContextMenu();
  });
  document.addEventListener("keydown", function(e){ if(e.key === "Escape") closeContextMenu(); });

  function collectSelectedItems(){
    var items = [];
    ui.selectedCells.forEach(function(c){
      var loc = locateBox(c.boxId);
      var v = loc && loc.box.vials[c.pos];
      if(v) items.push({boxId:c.boxId, pos:c.pos, vial:v, cellLine:v.cellLine});
    });
    return items;
  }

  function ctxDuplicate(){
    closeContextMenu();
    startPickQueue("duplicate", collectSelectedItems());
  }
  function ctxMove(){
    closeContextMenu();
    startPickQueue("move", collectSelectedItems());
  }
  async function ctxRemove(){
    closeContextMenu();
    var items = ui.selectedCells.slice();
    if(!items.length) return;
    if(!confirm("Delete " + items.length + " sample(s)? This can't be undone.")) return;
    var byBox = {};
    items.forEach(function(c){ (byBox[c.boxId] = byBox[c.boxId] || []).push(c.pos); });
    await withSaving(function(){
      var calls = Object.keys(byBox).map(function(boxId){
        return supabase.from("samples").delete().eq("box_id", boxId).in("position", byBox[boxId]);
      });
      return Promise.all(calls).then(function(results){
        var failed = results.find(function(r){ return r.error; });
        return failed ? {error: failed.error} : {error:null};
      });
    });
    ui.selectedCells = [];
    ui.editingPos = null;
    await refreshInventory();
  }

  var IMPORT_HEADER_MAP = {
    tank:"tank", rack:"rack", box:"box", position:"position",
    cellline:"cellLine", type:"type", passage:"passage",
    clone:"clone", viability:"viability", freezedate:"freezeDate",
    count:"count", medium:"medium", mycoplasma:"myco",
    owner:"owner", notes:"notes"
  };
  function normalizeHeader(h){ return String(h||"").toLowerCase().replace(/[^a-z]/g, ""); }
  function normKey(s){ return String(s||"").trim().toLowerCase(); }

  function parseTypeValue(s){
    s = String(s||"").trim().toLowerCase();
    for(var i=0;i<TYPE_ORDER.length;i++){
      var k = TYPE_ORDER[i];
      if(k === s || TYPES[k].label.toLowerCase() === s) return k;
    }
    return "other";
  }
  function parseMycoValue(s){
    return String(s||"").trim().toLowerCase() === "negative" ? "negative" : "";
  }
  function inferDims(pos){
    var m = /^([A-Za-z]+)(\d+)$/.exec(pos);
    if(!m) return {rows:9, cols:9};
    var letters = m[1].toUpperCase(), rowNum = 0;
    for(var i=0;i<letters.length;i++){ rowNum = rowNum*26 + (letters.charCodeAt(i)-64); }
    return {rows: Math.max(9, rowNum), cols: Math.max(9, parseInt(m[2],10))};
  }

  // Minimal CSV parser — handles quoted fields with embedded commas/newlines/escaped quotes.
  function parseCSV(text){
    var rows = [], row = [], field = "", inQuotes = false;
    for(var i=0;i<text.length;i++){
      var c = text[i];
      if(inQuotes){
        if(c === '"'){ if(text[i+1] === '"'){ field += '"'; i++; } else inQuotes = false; }
        else field += c;
      }else{
        if(c === '"') inQuotes = true;
        else if(c === ','){ row.push(field); field = ""; }
        else if(c === '\n'){ row.push(field); rows.push(row); row=[]; field=""; }
        else if(c === '\r'){ /* skip — \n handles the line break */ }
        else field += c;
      }
    }
    if(field.length || row.length){ row.push(field); rows.push(row); }
    return rows;
  }

  function rowsToObjects(rows){
    rows = rows.filter(function(r){ return r.some(function(c){ return String(c==null?"":c).trim() !== ""; }); });
    if(!rows.length) return [];
    var headers = rows[0].map(normalizeHeader);
    return rows.slice(1).map(function(r){
      var obj = {};
      headers.forEach(function(h, idx){
        var key = IMPORT_HEADER_MAP[h];
        if(key) obj[key] = r[idx];
      });
      return obj;
    });
  }

  function parseImportFile(file){
    return new Promise(function(resolve, reject){
      var isExcel = /\.xlsx?$/i.test(file.name);
      var reader = new FileReader();
      reader.onerror = function(){ reject(new Error("Could not read the file")); };
      if(isExcel){
        reader.onload = function(){
          try{
            var wb = XLSX.read(new Uint8Array(reader.result), {type:"array"});
            var sheet = wb.Sheets[wb.SheetNames[0]];
            var rows = XLSX.utils.sheet_to_json(sheet, {header:1, defval:""});
            resolve(rowsToObjects(rows));
          }catch(e){ reject(e); }
        };
        reader.readAsArrayBuffer(file);
      }else{
        reader.onload = function(){
          try{ resolve(rowsToObjects(parseCSV(String(reader.result)))); }
          catch(e){ reject(e); }
        };
        reader.readAsText(file);
      }
    });
  }

  // Resolves (creating as needed) the tank/rack/box for each row, in order, then
  // upserts the sample. Sequential on purpose so repeated names within the same
  // file reuse the tank/rack/box just created instead of racing to create it twice.
  async function processImportRows(objRows){
    var report = {tanksCreated:0, racksCreated:0, boxesCreated:0, samplesImported:0, skipped:[]};
    var tanks = {};
    state.tanks.forEach(function(t){
      var racks = {};
      t.racks.forEach(function(r){
        var boxes = {};
        r.boxes.forEach(function(b){ boxes[normKey(b.name)] = {id:b.id, rows:b.rows, cols:b.cols}; });
        racks[normKey(r.name)] = {id:r.id, boxes:boxes};
      });
      tanks[normKey(t.name)] = {id:t.id, racks:racks};
    });

    for(var i=0;i<objRows.length;i++){
      var r = objRows[i], rowNum = i + 2;
      var tankName = (r.tank||"").trim(), rackName = (r.rack||"").trim(), boxName = (r.box||"").trim();
      var pos = (r.position||"").trim().toUpperCase();
      var cellLine = (r.cellLine||"").trim();
      if(!tankName || !rackName || !boxName || !pos || !cellLine){
        report.skipped.push("Row "+rowNum+": missing tank, rack, box, position or cell line");
        continue;
      }
      var tank = tanks[normKey(tankName)];
      if(!tank){
        var tRes = await supabase.from("tanks").insert({name:tankName, sort_order:Object.keys(tanks).length, created_by:session.user.id}).select().single();
        if(tRes.error){ report.skipped.push("Row "+rowNum+": couldn't create tank \""+tankName+"\" — "+tRes.error.message); continue; }
        tank = {id:tRes.data.id, racks:{}};
        tanks[normKey(tankName)] = tank;
        report.tanksCreated++;
      }
      var rack = tank.racks[normKey(rackName)];
      if(!rack){
        var rRes = await supabase.from("racks").insert({tank_id:tank.id, name:rackName, sort_order:Object.keys(tank.racks).length, created_by:session.user.id}).select().single();
        if(rRes.error){ report.skipped.push("Row "+rowNum+": couldn't create rack \""+rackName+"\" — "+rRes.error.message); continue; }
        rack = {id:rRes.data.id, boxes:{}};
        tank.racks[normKey(rackName)] = rack;
        report.racksCreated++;
      }
      var box = rack.boxes[normKey(boxName)];
      var dims = inferDims(pos);
      if(!box){
        var bRes = await supabase.from("boxes").insert({rack_id:rack.id, name:boxName, rows:dims.rows, cols:dims.cols, sort_order:Object.keys(rack.boxes).length, created_by:session.user.id}).select().single();
        if(bRes.error){ report.skipped.push("Row "+rowNum+": couldn't create box \""+boxName+"\" — "+bRes.error.message); continue; }
        box = {id:bRes.data.id, rows:dims.rows, cols:dims.cols};
        rack.boxes[normKey(boxName)] = box;
        report.boxesCreated++;
      }else if(dims.rows > box.rows || dims.cols > box.cols){
        box.rows = Math.max(box.rows, dims.rows);
        box.cols = Math.max(box.cols, dims.cols);
        await supabase.from("boxes").update({rows:box.rows, cols:box.cols}).eq("id", box.id);
      }
      var sampleRow = {
        box_id: box.id, position: pos, cell_line: cellLine,
        type: parseTypeValue(r.type), passage: (r.passage||"").trim(),
        freeze_date: (r.freezeDate||"").trim() || null,
        count: (r.count||"").trim(), medium: (r.medium||"").trim(),
        myco: parseMycoValue(r.myco), clone: (r.clone||"").trim(),
        viability: (r.viability||"").trim(),
        owner: (r.owner||"").trim(), notes: (r.notes||"").trim()
      };
      var sRes = await supabase.from("samples").upsert(sampleRow, {onConflict:"box_id,position"});
      if(sRes.error){ report.skipped.push("Row "+rowNum+" ("+pos+"): "+sRes.error.message); continue; }
      report.samplesImported++;
    }
    return report;
  }

  async function submitImport(){
    var fileInput = document.getElementById("m-import-file");
    var file = fileInput && fileInput.files[0];
    if(!file){ alert("Choose a file first."); return; }
    ui.addModal = {kind:"import", busy:true};
    renderModal();
    var report;
    try{
      var objRows = await parseImportFile(file);
      report = await processImportRows(objRows);
    }catch(e){
      report = {tanksCreated:0, racksCreated:0, boxesCreated:0, samplesImported:0, skipped:["File error: "+(e && e.message ? e.message : e)]};
    }
    ui.addModal = {kind:"import", report:report};
    renderModal();
    await refreshInventory();
  }

  // ---------- deletes ----------
  async function confirmDeleteTank(id){
    var tank = state.tanks.find(function(t){return t.id===id;});
    if(!tank) return;
    if(!confirm('Delete tank "'+tank.name+'" and everything in it (racks, boxes, samples)?')) return;
    if(ui.selectedBoxId && locateBox(ui.selectedBoxId) && locateBox(ui.selectedBoxId).tank.id===id) ui.selectedBoxId = null;
    await removeTank(id);
  }
  async function confirmDeleteRack(rackId){
    if(!confirm("Delete this rack and everything in it?")) return;
    await removeRack(rackId);
    if(ui.selectedBoxId && !locateBox(ui.selectedBoxId)) { ui.selectedBoxId = null; renderMain(); }
  }
  async function confirmDeleteBox(boxId){
    if(!confirm("Delete this box and all its samples?")) return;
    if(ui.selectedBoxId === boxId) ui.selectedBoxId = null;
    await removeBox(boxId);
  }

  // ---------- export ----------
  function downloadCSV(filename, rows){
    var csv = rows.map(function(row){
      return row.map(function(cell){
        var s = String(cell==null?"":cell);
        if(/[",\n]/.test(s)) s = '"' + s.replace(/"/g,'""') + '"';
        return s;
      }).join(",");
    }).join("\r\n");
    var blob = new Blob([csv], {type:"text/csv;charset=utf-8;"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function downloadImportTemplate(){
    var headers = ["Tank","Rack","Box","Position","Cell line","Type","Passage","Clone","Viability","Freeze date","Count","Medium","Mycoplasma","Owner","Notes"];
    var example = ["Tank 1","Rack A","Box 1","A1","PC3-PIP","Tumor line","P8","Clone 4B2","92%","2026-08-27","5x10^6 /mL","90% FBS + 10% DMSO","Negative","Iveta","example row — delete before importing"];
    downloadCSV("cryostock_import_template.csv", [headers, example]);
  }

  function exportCSV(){
    var mycoLabel = {negative:"Negative"};
    var rows = [["Tank","Rack","Box","Position","Cell line","Type","Passage","Clone","Viability","Freeze date","Count","Medium","Mycoplasma","Owner","Notes","Added at","Added by"]];
    allVialsFlat().forEach(function(r){
      var v = r.vial;
      rows.push([r.tank.name, r.rack.name, r.box.name, r.pos, v.cellLine, (TYPES[v.type]||{}).label||v.type,
        v.passage, v.clone, v.viability, v.freezeDate, v.count, v.medium, mycoLabel[v.myco]||"Not sure (not tested)", v.owner, v.notes, v.addedAt, v.addedBy]);
    });
    downloadCSV("cryostock_export.csv", rows);
  }
